<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
  </defs>
  <style>
    .t   { fill: #24292f; font-size: 14px; text-anchor: middle; }
    .ts  { fill: #5a6472; font-size: 12px; text-anchor: middle; }
    .step { fill: #eceff3; stroke: #8a94a0; stroke-width: 1.5; }
    .s0 { fill: #f3f5f8; }
    .s1 { fill: #e3eef6; stroke: #6a9fbf; }
    .s2 { fill: #d5e8f2; stroke: #1d84a8; }
    .s3 { fill: #c2dff0; stroke: #14607c; }
  </style>

  <text class="t" x="440" y="26" style="font-size:16px; font-weight:bold;">三级验证阶梯：每一级复用上一级的语义</text>

  <!-- staircase -->
  <rect class="step s0" x="30"  y="200" width="190" height="70" rx="8"/>
  <text class="t" x="125" y="228">第 0 级 · 软件基线</text>
  <text class="ts" x="125" y="248">真机实速 · 收益/功耗 · 语义 golden</text>
  <text class="ts" x="125" y="284">Go/No-Go 阿姆达尔审查</text>

  <rect class="step s1" x="240" y="150" width="190" height="120" rx="8"/>
  <text class="t" x="335" y="178">第 1 级 · 可执行规格</text>
  <text class="ts" x="335" y="198">纯 C99 核心：解析/流表/校验和/微码解释器</text>
  <text class="ts" x="335" y="216">三型装配 · 秒级迭代 · 进 CI</text>
  <text class="ts" x="335" y="234">微码与表 ABI 的"活规格书"</text>
  <text class="ts" x="335" y="284">语义风险在此拆掉</text>

  <rect class="step s2" x="450" y="100" width="190" height="170" rx="8"/>
  <text class="t" x="545" y="128">第 2 级 · QEMU 设备</text>
  <text class="ts" x="545" y="148">同一核心编进设备模型</text>
  <text class="ts" x="545" y="166">guest 真实驱动：CSR/环/中断全链</text>
  <text class="ts" x="545" y="184">RTL 之前的软硬件联调</text>
  <text class="ts" x="545" y="284">ABI 风险在此拆掉</text>

  <rect class="step s3" x="660" y="50" width="190" height="220" rx="8"/>
  <text class="t" x="755" y="78">第 3 级 · FPGA / ASIC</text>
  <text class="ts" x="755" y="98">逐指令 bit-exact 对拍</text>
  <text class="ts" x="755" y="116">百万包向量 · 驱动一行不改</text>
  <text class="ts" x="755" y="134">时序与真实行为</text>
  <text class="ts" x="755" y="284">时序风险在此拆掉</text>

  <line x1="222" y1="220" x2="238" y2="205" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="432" y1="170" x2="448" y2="155" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="642" y1="120" x2="658" y2="105" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- shared core band -->
  <rect x="30" y="20" width="820" height="0" fill="none"/>
  <path d="M 440 302 L 440 292" stroke="none"/>
  <text class="ts" x="440" y="312" style="fill:#14607c;">贯穿纪律：单一 ABI 冻结头文件 · 同一份核心库共链复用 · trace 不一致 = 分叉，CI 拦截 · 语义真源单点</text>
</svg>
