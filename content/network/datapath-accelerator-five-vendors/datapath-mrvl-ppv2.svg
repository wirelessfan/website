<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 335" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
  </defs>
  <style>
    .t   { fill: #24292f; font-size: 14px; text-anchor: middle; }
    .ts  { fill: #5a6472; font-size: 12px; text-anchor: middle; }
    .box { fill: #eceff3; stroke: #8a94a0; stroke-width: 1.5; }
    .hi  { fill: #d9ecf5; stroke: #1d84a8; stroke-width: 1.8; }
    .gate{ fill: #f9ece5; stroke: #d97a4e; stroke-width: 1.5; }
    .pool{ fill: #d9ecf5; stroke: #14607c; stroke-width: 1.8; }
  </style>

  <text class="t" x="440" y="24" style="font-size:16px; font-weight:bold;">Marvell PPv2：企业级护栏 —— 高装载率与不死锁</text>

  <!-- pipeline -->
  <rect class="hi" x="40" y="44" width="190" height="64" rx="8"/>
  <text class="t" x="135" y="68">PRS 可编程解析</text>
  <text class="ts" x="135" y="88">TCAM 步进 · 输出 L2/L3/L4 偏移</text>
  <rect class="box" x="260" y="44" width="180" height="64" rx="8"/>
  <text class="t" x="350" y="68">CLS 分类</text>
  <text class="ts" x="350" y="88">C3 哈希流表（防撞车）</text>
  <rect class="box" x="470" y="44" width="150" height="64" rx="8"/>
  <text class="t" x="545" y="68">微指令改头</text>
  <text class="ts" x="545" y="88">拿偏移即用，免数偏移</text>
  <rect class="box" x="650" y="44" width="190" height="64" rx="8"/>
  <text class="t" x="745" y="68">BM 缓冲管理</text>
  <text class="ts" x="745" y="88">多池 + 水位反馈</text>
  <line x1="230" y1="76" x2="256" y2="76" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar5)"/>
  <line x1="440" y1="76" x2="466" y2="76" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar5)"/>
  <line x1="620" y1="76" x2="646" y2="76" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar5)"/>

  <text class="t" x="440" y="142" style="font-size:14px; font-weight:bold;">双水位背压：绝不让慢出口抽干全局接收池</text>

  <!-- pool and slow egress -->
  <rect class="pool" x="40" y="180" width="170" height="72" rx="8"/>
  <text class="t" x="125" y="208">全局接收池</text>
  <text class="ts" x="125" y="228">空闲槽有限</text>
  <rect class="box" x="670" y="180" width="170" height="72" rx="8"/>
  <text class="t" x="755" y="208">慢速出口</text>
  <text class="ts" x="755" y="228">如 Wi-Fi SDIO · 发送阻塞</text>
  <line x1="210" y1="216" x2="666" y2="216" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar5)"/>
  <text class="ts" x="438" y="208">零拷贝借出接收缓冲去发送</text>

  <!-- gates -->
  <rect class="gate" x="250" y="146" width="200" height="46" rx="8"/>
  <text class="ts" x="350" y="165">① 源端保命水位</text>
  <text class="ts" x="350" y="183">空闲低于阈值 → 严禁借出</text>
  <line x1="350" y1="192" x2="350" y2="212" stroke="#d97a4e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect class="gate" x="430" y="238" width="200" height="46" rx="8"/>
  <text class="ts" x="530" y="257">② 出口配额 N</text>
  <text class="ts" x="530" y="275">超额 → 硬件 tail-drop + 计数</text>
  <line x1="530" y1="220" x2="530" y2="236" stroke="#d97a4e" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text class="ts" x="440" y="310">电梯场景：Wi-Fi 变慢，几百个缓冲卡在发送队列 —— 双水位保证控制包永远进得来，整机不死锁</text>
  <text class="ts" x="440" y="328">（主线锚点：mvpp2_main.c:900-932 mvpp2_bm_pool_update_fc）</text>
</svg>
