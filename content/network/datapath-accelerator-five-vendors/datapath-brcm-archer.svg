<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 335" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
  </defs>
  <style>
    .t   { fill: #24292f; font-size: 14px; text-anchor: middle; }
    .ts  { fill: #5a6472; font-size: 12px; text-anchor: middle; }
    .box { fill: #eceff3; stroke: #8a94a0; stroke-width: 1.5; }
    .hi  { fill: #d9ecf5; stroke: #1d84a8; stroke-width: 1.8; }
    .core{ fill: #ffffff; stroke: #8a94a0; stroke-width: 1.2; }
    .warn{ fill: #f9ece5; stroke: #d97a4e; stroke-width: 1.2; }
  </style>

  <text class="t" x="440" y="24" style="font-size:16px; font-weight:bold;">博通：从多核并发的弯路，到"大道至简"（lore：仅取设计原则）</text>

  <!-- early Runner -->
  <rect class="box" x="40" y="60" width="255" height="170" rx="10"/>
  <text class="t" x="167" y="86" style="font-weight:bold;">早年 · Runner / XRDP</text>
  <rect class="core" x="58"  y="112" width="64" height="42" rx="6"/>
  <text class="ts" x="90"  y="137">微码核1</text>
  <rect class="core" x="136" y="112" width="64" height="42" rx="6"/>
  <text class="ts" x="168" y="137">微码核2</text>
  <rect class="core" x="214" y="112" width="64" height="42" rx="6"/>
  <text class="ts" x="246" y="137">微码核3</text>
  <line x1="122" y1="126" x2="134" y2="140" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="134" y1="126" x2="122" y2="140" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="200" y1="126" x2="212" y2="140" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="212" y1="126" x2="200" y2="140" stroke="#5a6472" stroke-width="1.2"/>
  <rect class="warn" x="58" y="172" width="220" height="42" rx="6"/>
  <text class="ts" x="168" y="189">跨核同流保序：同步沉重</text>
  <text class="ts" x="168" y="206">固件调试痛苦</text>

  <!-- convergence arrow -->
  <line x1="305" y1="145" x2="385" y2="145" stroke="#1d84a8" stroke-width="2" marker-end="url(#ar4)"/>
  <text class="ts" x="345" y="134" style="fill:#14607c;">收敛</text>

  <!-- later Archer -->
  <rect class="hi" x="395" y="55" width="450" height="175" rx="10"/>
  <text class="t" x="620" y="81" style="font-weight:bold;">后来 · Archer</text>
  <rect class="box" x="415" y="98" width="125" height="48" rx="6"/>
  <text class="ts" x="477" y="118">硬件解析查表</text>
  <rect class="box" x="565" y="98" width="130" height="48" rx="6"/>
  <text class="ts" x="630" y="118">无环 cmdlist</text>
  <rect class="box" x="720" y="98" width="105" height="48" rx="6"/>
  <text class="ts" x="772" y="118">按流挂载</text>
  <line x1="540" y1="122" x2="561" y2="122" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="695" y1="122" x2="716" y2="122" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar4)"/>
  <text class="ts" x="620" y="172">无循环 · 定长 · 静态可验证 —— 最坏周期编译期可穷举</text>
  <text class="ts" x="620" y="196">短小无环的命令式处理，每流绑定一份指令序列</text>

  <!-- two-level table -->
  <rect class="box" x="395" y="252" width="200" height="44" rx="8"/>
  <text class="ts" x="495" y="270">NATC 片上小缓存</text>
  <rect class="box" x="645" y="252" width="200" height="44" rx="8"/>
  <text class="ts" x="745" y="270">DDR 全量大表</text>
  <line x1="595" y1="274" x2="641" y2="274" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="641" y1="284" x2="595" y2="284" stroke="#5a6472" stroke-width="1.5" marker-end="url(#ar4)"/>
  <text class="ts" x="250" y="279">分级查表：小缓存撬动大表</text>
  <text class="ts" x="440" y="322">缓存容量与命中率挂钩 —— 以自己的活跃流工作集实测定档，不引用任何无锚点数字（主线无代码，D 级）</text>
</svg>
