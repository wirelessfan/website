baseURL: "http://localhost:1313/"
title: "BW 技术札记"
theme: "PaperMod"
locale: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true
buildFuture: true
summaryLength: 120

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags

menu:
  main:
    - identifier: chip
      name: 芯片设计与选型
      url: /chip/
      weight: 10
    - identifier: network
      name: 网络技术优化
      url: /network/
      weight: 20
    - identifier: ai
      name: AI 自动化
      url: /ai/
      weight: 30
    - identifier: topics
      name: 主题
      url: /topics/
      weight: 35
    - identifier: follow_up
      name: "Follow Up"
      url: /follow_up/
      weight: 38
    - identifier: vip
      name: "VIP 🔒"
      url: /vip/
      weight: 40
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 45
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 55

params:
  env: production
  description: "芯片设计与选型、网络技术优化、AI 自动化三个方向的工程实践与技术探讨。"
  assets:
    favicon: favicon.svg
    favicon16x16: favicon.svg
    favicon32x32: favicon.svg
    apple_touch_icon: favicon.svg
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  comments: true
  mainSections: ["chip", "network", "ai"]
  homeInfoParams:
    Title: BW 技术札记
    Content: >
      记录芯片设计与选型、网络技术优化、AI 自动化三个方向的工程实践与探讨。

      文章多源自真实项目的调研、选型与复盘，欢迎同行指正交流。

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    noClasses: true
    lineNos: false
    codeFences: true
module:
  mounts:
    - source: content
      target: content
    - source: vip-content
      target: content/vip
