# GitHub Actions: push 到 main 自动构建并部署到 VPS。
# 首次使用需在仓库 Settings → Secrets 配置:
#   VPS_SSH_KEY  — 可以登录 VPS 的私钥（pem 内容，含 BEGIN/END 行）
name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Check secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_BASEURL: ${{ secrets.VPS_BASEURL }}
        run: |
          miss=0
          [ -n "$VPS_SSH_KEY" ]   || { echo "::error::缺少 secret VPS_SSH_KEY（VPS 私钥全文）"; miss=1; }
          [ -n "$VPS_HOST" ]      || { echo "::error::缺少 secret VPS_HOST（服务器地址）"; miss=1; }
          [ -n "$VPS_BASEURL" ]   || { echo "::error::缺少 secret VPS_BASEURL（站点地址，防 localhost 错误构建）"; miss=1; }
          [ $miss -eq 0 ] || exit 1

      - name: Build
        run: hugo --gc --minify --baseURL "$VPS_BASEURL"
        env:
          VPS_BASEURL: ${{ secrets.VPS_BASEURL }}

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: root
          TARGET: /var/www/blog/
          ARGS: -avz --delete
